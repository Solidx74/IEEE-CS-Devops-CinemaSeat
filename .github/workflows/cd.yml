name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web:${{ github.sha }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run API tests
        run: |
          docker build --target test -t cinemaseat-api-test ./api
          docker run --rm cinemaseat-api-test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.API_IMAGE }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.WEB_IMAGE }}

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build-test-push
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Deploy Compose stack on AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          API_IMAGE: ${{ env.API_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_IMAGE,WEB_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            cd ${{ secrets.EC2_DEPLOY_PATH }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export API_IMAGE WEB_IMAGE
            docker compose pull api web db redis gateway
            docker compose up -d --no-build --remove-orphans
