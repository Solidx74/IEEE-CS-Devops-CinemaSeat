name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API test image
        run: docker build --target test -t cinemaseat-api-test ./api
      - name: Run API tests
        run: docker run --rm cinemaseat-api-test
      - name: Build API runtime image
        run: docker build -t cinemaseat-api ./api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Audit production dependencies
        run: npm audit --omit=dev
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet

